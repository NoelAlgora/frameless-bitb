# Inject JQuery, CSS, and JS
Substitute "s|</head>|<script src='https:/\/ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js'></script> \
    <script src='/secondary/script.js'></script> \
    </head>|ni"


# Inject relevant CSS file
